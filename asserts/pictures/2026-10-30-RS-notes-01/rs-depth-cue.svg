<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/>
    </marker>
    <marker id="mCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0E7490"/>
    </marker>
    <marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F43F5E"/>
    </marker>
    <marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1600" height="940" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="64" y="56" font-size="17" font-weight="600" letter-spacing="3" fill="#2563EB">ROLLING SHUTTER · 研究意义 ①</text>
  <text x="64" y="104" font-size="38" font-weight="700" fill="#0F172A">倾斜越明显，物体离相机越近</text>
  <text x="64" y="140" font-size="20" fill="#64748B">相机向右匀速平移时，同一帧里近处的杆被「拖」得更歪，远处的杆几乎保持竖直</text>

  <!-- 左卡：真实场景 -->
  <rect x="64" y="165" width="700" height="645" rx="18" fill="#F8FAFC" stroke="#E5E7EB" filter="url(#shadow)"/>
  <text x="96" y="206" font-size="21" font-weight="600" fill="#0F172A">① 真实场景（侧视）</text>
  <text x="96" y="238" font-size="16" fill="#94A3B8">相机以速度 v 向右平移，两根杆静止在地面上</text>

  <line x1="96" y1="680" x2="732" y2="680" stroke="#CBD5E1" stroke-width="2"/>

  <!-- 相机 -->
  <rect x="110" y="618" width="104" height="62" rx="10" fill="#1E293B"/>
  <rect x="214" y="634" width="24" height="30" rx="5" fill="#475569"/>
  <line x1="126" y1="582" x2="276" y2="582" stroke="#2563EB" stroke-width="3" marker-end="url(#mBlue)"/>
  <text x="290" y="589" font-size="19" font-weight="600" fill="#2563EB">v</text>

  <!-- 两根杆 -->
  <rect x="455" y="300" width="24" height="380" rx="4" fill="#334155"/>
  <rect x="640" y="450" width="14" height="230" rx="3" fill="#94A3B8"/>
  <text x="492" y="332" font-size="16" fill="#334155">近</text>
  <text x="664" y="480" font-size="16" fill="#94A3B8">远</text>

  <!-- 距离标注 -->
  <line x1="240" y1="722" x2="452" y2="722" stroke="#0E7490" stroke-width="2" marker-start="url(#mCyan)" marker-end="url(#mCyan)"/>
  <text x="346" y="712" text-anchor="middle" font-size="15" fill="#0E7490" stroke="#F8FAFC" stroke-width="4" paint-order="stroke">D₁（近）</text>
  <line x1="240" y1="768" x2="637" y2="768" stroke="#0E7490" stroke-width="2" marker-start="url(#mCyan)" marker-end="url(#mCyan)"/>
  <text x="438" y="758" text-anchor="middle" font-size="15" fill="#0E7490" stroke="#F8FAFC" stroke-width="4" paint-order="stroke">D₂（远）</text>

  <!-- 中间箭头 -->
  <line x1="778" y1="500" x2="826" y2="500" stroke="#94A3B8" stroke-width="3" marker-end="url(#mGray)"/>
  <text x="802" y="482" text-anchor="middle" font-size="14" fill="#94A3B8">一帧</text>

  <!-- 右卡：RS 图像 -->
  <rect x="836" y="165" width="700" height="645" rx="18" fill="#F8FAFC" stroke="#E5E7EB" filter="url(#shadow)"/>
  <text x="868" y="206" font-size="21" font-weight="600" fill="#0F172A">② 拍出的这一帧（RS 图像）</text>
  <text x="868" y="238" font-size="16" fill="#94A3B8">上先行曝光、下后行曝光：竖直的杆被拍成了斜线</text>

  <rect x="880" y="250" width="620" height="420" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <line x1="900" y1="630" x2="1480" y2="630" stroke="#E2E8F0" stroke-width="2"/>
  <text x="896" y="282" font-size="13" fill="#94A3B8">行扫描方向 ↓</text>

  <!-- 图像中的两根斜杆 -->
  <line x1="1010" y1="630" x2="1170" y2="300" stroke="#334155" stroke-width="22" stroke-linecap="round"/>
  <line x1="1300" y1="630" x2="1315" y2="470" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>

  <!-- 近杆：参考线与水平位移 -->
  <line x1="1010" y1="630" x2="1010" y2="300" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="1010" y1="300" x2="1170" y2="300" stroke="#F43F5E" stroke-width="2" marker-start="url(#mRed)" marker-end="url(#mRed)"/>
  <text x="1090" y="288" text-anchor="middle" font-size="14" fill="#F43F5E">Δx₁</text>

  <!-- 远杆：参考线与水平位移 -->
  <line x1="1300" y1="630" x2="1300" y2="470" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="1300" y1="470" x2="1318" y2="470" stroke="#F43F5E" stroke-width="2" marker-start="url(#mRed)" marker-end="url(#mRed)"/>
  <text x="1332" y="466" font-size="13" fill="#F43F5E">Δx₂ 小</text>

  <!-- 倾角 -->
  <path d="M 1010 550 A 80 80 0 0 1 1034.9 558.1" fill="none" stroke="#F43F5E" stroke-width="2"/>
  <text x="1052" y="592" font-size="16" font-weight="600" fill="#F43F5E">θ₁</text>
  <text x="1329" y="618" font-size="15" fill="#94A3B8">θ₂ ≈ 0</text>

  <!-- 结论胶囊 -->
  <rect x="890" y="702" width="270" height="46" rx="23" fill="#FEF2F2" stroke="#FECDD3"/>
  <text x="1025" y="731" text-anchor="middle" font-size="17" font-weight="600" fill="#E11D48">θ₁ 大 ⇒ 物体近</text>
  <rect x="1190" y="702" width="270" height="46" rx="23" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="1325" y="731" text-anchor="middle" font-size="17" font-weight="600" fill="#64748B">θ₂ 小 ⇒ 物体远</text>

  <!-- 结论条 -->
  <rect x="64" y="834" width="1472" height="68" rx="16" fill="#F0F9FF" stroke="#BAE6FD"/>
  <text x="96" y="876" font-size="19" fill="#0F172A">结论：相机速度固定时，倾角只由距离决定——倾得越猛，离得越近；越接近竖直，离得越远。</text>
  <text x="1504" y="876" text-anchor="end" font-size="16" fill="#64748B">Δx ≈ v·f·Δt / D</text>
</svg>
