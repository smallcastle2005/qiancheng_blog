<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F43F5E"/>
    </marker>
    <marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#CBD5E1"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="64" y="56" font-size="17" font-weight="600" letter-spacing="3" fill="#2563EB">ROLLING SHUTTER · 研究意义 ②</text>
  <text x="64" y="104" font-size="38" font-weight="700" fill="#0F172A">倾斜的方向，就是相机运动的方向</text>
  <text x="64" y="140" font-size="20" fill="#64748B">顶部行先曝光、底部行后曝光——看柱顶偏向哪边，相机就往哪边移动</text>

  <!-- 卡 A：右移 -->
  <rect x="64" y="160" width="716" height="540" rx="18" fill="#F8FAFC" stroke="#E5E7EB" filter="url(#shadow)"/>
  <text x="96" y="206" font-size="21" font-weight="600" fill="#0F172A">情况 A：相机向右移动</text>

  <rect x="96" y="250" width="320" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <line x1="116" y1="580" x2="396" y2="580" stroke="#E2E8F0" stroke-width="2"/>
  <text x="108" y="286" font-size="12" fill="#94A3B8">先曝光</text>
  <text x="108" y="574" font-size="12" fill="#94A3B8">后曝光</text>
  <line x1="126" y1="296" x2="126" y2="558" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#mGray)"/>

  <line x1="240" y1="580" x2="300" y2="330" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
  <line x1="240" y1="580" x2="240" y2="330" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="240" y1="330" x2="300" y2="330" stroke="#F43F5E" stroke-width="2" marker-end="url(#mRed)"/>
  <text x="270" y="318" text-anchor="middle" font-size="13" fill="#F43F5E">Δx</text>

  <text x="456" y="350" font-size="26" font-weight="700" fill="#F43F5E">柱顶偏向右</text>
  <text x="456" y="386" font-size="14" fill="#94A3B8">（柱顶相对柱底）</text>
  <text x="456" y="452" font-size="24" font-weight="700" fill="#2563EB">⇒ 相机向右移动</text>
  <text x="456" y="496" font-size="14" fill="#64748B">顶部行先曝光，记录的是更早的时刻；</text>
  <text x="456" y="520" font-size="14" fill="#64748B">更早时刻物体还在右边 → 柱顶偏右</text>

  <!-- 卡 B：左移 -->
  <rect x="820" y="160" width="716" height="540" rx="18" fill="#F8FAFC" stroke="#E5E7EB" filter="url(#shadow)"/>
  <text x="852" y="206" font-size="21" font-weight="600" fill="#0F172A">情况 B：相机向左移动</text>

  <rect x="852" y="250" width="320" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <line x1="872" y1="580" x2="1152" y2="580" stroke="#E2E8F0" stroke-width="2"/>
  <text x="864" y="286" font-size="12" fill="#94A3B8">先曝光</text>
  <text x="864" y="574" font-size="12" fill="#94A3B8">后曝光</text>
  <line x1="882" y1="296" x2="882" y2="558" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#mGray)"/>

  <line x1="996" y1="580" x2="936" y2="330" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
  <line x1="996" y1="580" x2="996" y2="330" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="996" y1="330" x2="936" y2="330" stroke="#F43F5E" stroke-width="2" marker-end="url(#mRed)"/>
  <text x="966" y="318" text-anchor="middle" font-size="13" fill="#F43F5E">Δx</text>

  <text x="1212" y="350" font-size="26" font-weight="700" fill="#F43F5E">柱顶偏向左</text>
  <text x="1212" y="386" font-size="14" fill="#94A3B8">（柱顶相对柱底）</text>
  <text x="1212" y="452" font-size="24" font-weight="700" fill="#2563EB">⇒ 相机向左移动</text>
  <text x="1212" y="496" font-size="14" fill="#64748B">顶部行先曝光，记录的是更早的时刻；</text>
  <text x="1212" y="520" font-size="14" fill="#64748B">更早时刻物体还在左边 → 柱顶偏左</text>

  <!-- 口诀条 -->
  <rect x="64" y="724" width="1472" height="58" rx="14" fill="#F0F9FF" stroke="#BAE6FD"/>
  <text x="96" y="761" font-size="19" fill="#0F172A">读图口诀：柱顶偏向哪边，相机就往哪边移动；反过来，已知相机方向，也能预测这一帧该往哪边歪。</text>
</svg>
